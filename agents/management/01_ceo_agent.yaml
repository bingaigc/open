agent_id: "ceo_001"
name: "CEO Agent"
role: "Chief Executive Officer"
description: "战略决策和整体协调"

# 模型配置
model:
  provider: "anthropic"
  name: "claude-opus-4.5"
  temperature: 0.7
  max_tokens: 4096
  top_p: 0.9

# 能力配置
capabilities:
  - strategic_planning
  - decision_making
  - resource_allocation
  - priority_management
  - risk_assessment
  - team_coordination
  - performance_monitoring

# 工具配置
tools:
  - name: "task_delegation"
    description: "将任务委派给其他智能体"
    enabled: true
  - name: "performance_monitoring"
    description: "监控团队和项目性能"
    enabled: true
  - name: "strategic_analysis"
    description: "进行战略分析和决策"
    enabled: true
  - name: "meeting_coordinator"
    description: "协调智能体之间的会议"
    enabled: true
  - name: "resource_allocator"
    description: "分配资源和预算"
    enabled: true

# 权限配置
permissions:
  level: "executive"
  access:
    - read_all_metrics
    - approve_major_decisions
    - allocate_resources
    - access_all_agents
    - override_decisions
  restrictions:
    - no_direct_code_access
    - no_infrastructure_changes

# 工作流配置
workflows:
  daily_briefing:
    enabled: true
    schedule: "0 9 * * *"  # 每天上午 9 点
    actions:
      - review_metrics
      - check_priorities
      - assign_tasks
      - send_updates
    notifications:
      - type: "slack"
        channel: "#executive"

  weekly_planning:
    enabled: true
    schedule: "0 9 * * 1"  # 每周一上午 9 点
    actions:
      - strategic_review
      - goal_setting
      - resource_planning
      - team_alignment
    notifications:
      - type: "email"
        recipients: ["all_managers"]

  monthly_review:
    enabled: true
    schedule: "0 14 1 * *"  # 每月 1 号下午 2 点
    actions:
      - performance_analysis
      - strategy_adjustment
      - budget_review
      - forecast_update

# 集成配置
integrations:
  slack:
    enabled: true
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channels:
      - "#executive"
      - "#announcements"
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    from_address: "ceo@openclaw.local"
  dashboard:
    enabled: true
    url: "http://localhost:3000/dashboard"
  database:
    enabled: true
    connection_string: "${DATABASE_URL}"

# 报告配置
reporting:
  frequency: "daily"
  format: "markdown"
  recipients:
    - "all_managers"
    - "stakeholders"
  metrics:
    - team_productivity
    - project_progress
    - resource_utilization
    - risk_factors
    - strategic_goals_progress

# 决策配置
decision_making:
  approval_required:
    - budget_over: 10000
    - new_project: true
    - strategic_change: true
    - resource_reallocation: true
  auto_approve:
    - routine_operations: true
    - minor_adjustments: true
  escalation:
    timeout: 3600  # 1 小时
    escalate_to: "manual_review"

# 学习配置
learning:
  enabled: true
  feedback_collection: true
  performance_tracking: true
  continuous_improvement: true
  knowledge_base: "/opt/openclaw/agents/knowledge/ceo"

# 安全配置
security:
  authentication: "jwt"
  encryption: "aes-256"
  audit_logging: true
  sensitive_data_handling: "encrypted"
  rate_limiting:
    requests_per_minute: 100
    burst: 20

# 监控配置
monitoring:
  enabled: true
  metrics:
    - response_time
    - decision_accuracy
    - task_completion_rate
    - resource_efficiency
  alerts:
    - type: "performance_degradation"
      threshold: 0.7
      action: "notify_admin"
    - type: "decision_timeout"
      threshold: 3600
      action: "escalate"

# 通信配置
communication:
  protocols:
    - http
    - websocket
  message_format: "json"
  compression: true
  retry_policy:
    max_attempts: 3
    backoff: "exponential"
    initial_delay: 1000

# 协作配置
collaboration:
  direct_reports:
    - "cto_001"
    - "cfo_001"
    - "coo_001"
  stakeholders:
    - "all_managers"
    - "project_leads"
  communication_style: "directive"
  meeting_frequency: "daily"

# 性能配置
performance:
  max_concurrent_tasks: 10
  task_timeout: 1800  # 30 分钟
  cache_enabled: true
  cache_ttl: 3600
  parallel_processing: true

# 备份配置
backup:
  enabled: true
  frequency: "daily"
  retention_days: 30
  location: "/opt/openclaw/backups/agents/ceo"
